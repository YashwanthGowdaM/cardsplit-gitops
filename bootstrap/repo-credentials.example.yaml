# Only needed when the GitOps repo is PRIVATE. Do not commit the real token:
#   kubectl apply -f this-file   (after filling in), then delete the local copy.
apiVersion: v1
kind: Secret
metadata:
  name: cardsplit-gitops-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: __GIT_REPO_URL__
  username: YOUR_GITHUB_USERNAME
  password: YOUR_GITHUB_PAT            # fine-grained PAT, "Contents: read-only" on this repo
