# Service-mesh policy for the app (sidecars are injected because the namespace
# is labelled istio-injection=enabled).
# --- mTLS --------------------------------------------------------------------
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: backend}
spec:
  selector: {matchLabels: {app: backend}}
  mtls: {mode: STRICT}
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: database}
spec:
  selector: {matchLabels: {app: database}}
  mtls: {mode: STRICT}
---
# The ALB is outside the mesh and sends plain HTTP straight to the pod IP.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: {name: frontend}
spec:
  selector: {matchLabels: {app: frontend}}
  mtls: {mode: PERMISSIVE}
---
# --- resilience --------------------------------------------------------------
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: backend}
spec:
  host: backend
  trafficPolicy:
    tls: {mode: ISTIO_MUTUAL}
    connectionPool:
      tcp: {maxConnections: 200}
      http: {http1MaxPendingRequests: 100, maxRequestsPerConnection: 0}
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: {name: database}
spec:
  host: database
  trafficPolicy:
    tls: {mode: ISTIO_MUTUAL}
    connectionPool:
      tcp: {maxConnections: 200, connectTimeout: 5s}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: {name: backend}
spec:
  hosts: [backend]
  http:
    - route:
        - destination: {host: backend, port: {number: 5000}}
      timeout: 60s
      retries:                     # only retry failures that cannot have executed the request
        attempts: 2
        perTryTimeout: 30s
        retryOn: connect-failure,refused-stream,unavailable
