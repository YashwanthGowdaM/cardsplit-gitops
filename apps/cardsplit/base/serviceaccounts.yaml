# One ServiceAccount per workload (least privilege; no API token mounted).
apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend, labels: {app.kubernetes.io/part-of: cardsplit}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: backend, labels: {app.kubernetes.io/part-of: cardsplit}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: database, labels: {app.kubernetes.io/part-of: cardsplit}}
automountServiceAccountToken: false
