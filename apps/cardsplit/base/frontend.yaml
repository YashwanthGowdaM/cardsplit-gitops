# =============================================================================
# FRONTEND - React build served by Nginx (port 80), proxies /api -> backend
# Covers: NODE ANTI-AFFINITY (NotIn), pod anti-affinity, pod affinity,
#         probes, resources, rolling strategy, ConfigMap-mounted nginx config.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: cardsplit
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: cardsplit
        version: v1
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        sidecar.istio.io/proxyCPU: 50m
        sidecar.istio.io/proxyMemory: 128Mi
        sidecar.istio.io/proxyCPULimit: 500m
        sidecar.istio.io/proxyMemoryLimit: 256Mi
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          # NODE ANTI-AFFINITY (required): never land on data or platform nodes
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: workload, operator: NotIn, values: [data, platform]}
          # ... and prefer the dedicated app nodes
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: workload, operator: In, values: [app]}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: frontend}
        # POD AFFINITY (preferred): same AZ as a backend pod (nginx -> API hop stays in-zone)
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels: {app: backend}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: frontend}
      containers:
        - name: frontend
          image: cardsplit/frontend:0.0.0       # replaced by overlay images:
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 80}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: BACKEND_HOST            # FQDN: nginx resolver ignores search domains
              value: backend.$(POD_NAMESPACE).svc.cluster.local
            - name: BACKEND_PORT
              value: "5000"
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "10"]}   # ALB deregistration is not instant
          # The stock nginx image starts as root (binds :80, chowns cache dirs),
          # so we keep only the capabilities it really needs.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
      volumes:
        - name: nginx-template
          configMap:
            name: frontend-nginx           # generated by kustomize (hash suffix -> auto rollout)
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app: frontend, app.kubernetes.io/part-of: cardsplit}
spec:
  type: ClusterIP                  # exposed to the internet through the ALB Ingress
  selector: {app: frontend}
  ports:
    - {name: http, port: 80, targetPort: http, protocol: TCP}
