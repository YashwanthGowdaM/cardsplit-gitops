# DEV overlay: 1 replica, small volume. Jenkins updates "newTag" below on every build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cardsplit-dev
resources:
  - ../../base
  - namespace.yaml
  - secret.yaml
  - authorization-policies.yaml
images:
  - name: cardsplit/frontend
    newName: __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/cardsplit/frontend
    newTag: "0.0.0"
  - name: cardsplit/backend
    newName: __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/cardsplit/backend
    newTag: "0.0.0"
  - name: cardsplit/database
    newName: __AWS_ACCOUNT_ID__.dkr.ecr.__AWS_REGION__.amazonaws.com/cardsplit/database
    newTag: "0.0.0"
patches:
  - target: {kind: Deployment, name: backend}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: HorizontalPodAutoscaler, name: backend}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 3}
  - target: {kind: HorizontalPodAutoscaler, name: frontend}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 3}
  - target: {kind: StatefulSet, name: database}
    patch: |-
      - {op: replace, path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage, value: 5Gi}
  - target: {kind: Ingress, name: frontend}
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1tags
        value: Environment=dev,Project=cardsplit
