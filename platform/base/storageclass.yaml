# STORAGE CLASSES (EBS CSI, gp3, encrypted, topology-aware)
# gp3-delete : default class, volume is deleted with the PVC  (Prometheus, Grafana, Splunk ...)
# gp3-retain : volume SURVIVES PVC deletion                    (CardSplit database)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-delete
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
  iops: "3000"
  throughput: "125"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer     # create the volume in the AZ where the pod lands
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-retain
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
  iops: "3000"
  throughput: "125"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
