# =============================================================================
# Fluent Bit (DaemonSet): tails every container log on every node, enriches it
# with Kubernetes metadata and ships it to Splunk through the HTTP Event Collector.
# =============================================================================
kind: DaemonSet
tolerations:
  - operator: Exists                        # run on ALL nodes, including the tainted data node
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits:   {cpu: 200m, memory: 200Mi}
env:
  - name: SPLUNK_HEC_TOKEN
    valueFrom:
      secretKeyRef: {name: splunk-secrets, key: HEC_TOKEN}
serviceMonitor:
  enabled: true                             # Fluent Bit metrics -> Prometheus
config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     20MB
        Skip_Long_Lines   On
        Refresh_Interval  10
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
    [FILTER]
        Name    modify
        Match   kube.*
        Add     cluster __CLUSTER_NAME__
  outputs: |
    [OUTPUT]
        Name              splunk
        Match             kube.*
        Host              splunk-hec.logging.svc.cluster.local
        Port              8088
        Splunk_Token      ${SPLUNK_HEC_TOKEN}
        Splunk_Send_Raw   Off
        TLS               On
        TLS.Verify        Off
        Event_Source      kubernetes
        Event_Sourcetype  _json
        Event_Index       main
        Retry_Limit       False
