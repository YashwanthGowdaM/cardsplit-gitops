apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cardsplit-alerts
  namespace: monitoring
spec:
  groups:
    - name: cardsplit.availability
      rules:
        - alert: CardSplitBackendDown
          expr: kube_deployment_status_replicas_available{namespace=~"cardsplit-.*", deployment="backend"} == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "Backend has no available replicas in {{ $labels.namespace }}"
        - alert: CardSplitFrontendDown
          expr: kube_deployment_status_replicas_available{namespace=~"cardsplit-.*", deployment="frontend"} == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "Frontend has no available replicas in {{ $labels.namespace }}"
        - alert: CardSplitDatabaseDown
          expr: pg_up{namespace=~"cardsplit-.*"} == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "PostgreSQL is down in {{ $labels.namespace }}"
        - alert: CardSplitPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"cardsplit-.*"}[15m]) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted more than 3 times in 15m"
    - name: cardsplit.performance
      rules:
        - alert: CardSplitBackendHigh5xxRate
          expr: |
            sum by (destination_workload_namespace) (rate(istio_requests_total{reporter="destination", destination_workload="backend", destination_workload_namespace=~"cardsplit-.*", response_code=~"5.."}[5m]))
            /
            sum by (destination_workload_namespace) (rate(istio_requests_total{reporter="destination", destination_workload="backend", destination_workload_namespace=~"cardsplit-.*"}[5m])) > 0.05
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "More than 5% of backend requests fail with 5xx in {{ $labels.destination_workload_namespace }}"
        - alert: CardSplitBackendHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le, destination_workload_namespace) (rate(istio_request_duration_milliseconds_bucket{reporter="destination", destination_workload="backend", destination_workload_namespace=~"cardsplit-.*"}[5m]))) > 1000
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Backend p95 latency above 1s in {{ $labels.destination_workload_namespace }}"
        - alert: CardSplitHpaAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace=~"cardsplit-.*"} == kube_horizontalpodautoscaler_spec_max_replicas{namespace=~"cardsplit-.*"}
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has been at max replicas for 15m"
    - name: cardsplit.storage
      rules:
        - alert: CardSplitVolumeAlmostFull
          expr: |
            kubelet_volume_stats_used_bytes{namespace=~"cardsplit-.*"} / kubelet_volume_stats_capacity_bytes{namespace=~"cardsplit-.*"} > 0.85
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 85% full"
