apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  sources:
    - repoURL: https://fluent.github.io/helm-charts
      chart: fluent-bit
      targetRevision: "0.*"          # pin an exact version with scripts/pin-chart-versions.sh
      helm:
        releaseName: fluent-bit
        valueFiles:
          - $values/platform/logging/fluent-bit-values.yaml
    - repoURL: __GIT_REPO_URL__
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
