apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  sources:
    - repoURL: https://kiali.org/helm-charts
      chart: kiali-server
      targetRevision: "2.*"          # pin an exact version with scripts/pin-chart-versions.sh
      helm:
        releaseName: kiali
        valueFiles:
          - $values/platform/kiali/values.yaml
    - repoURL: __GIT_REPO_URL__
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
